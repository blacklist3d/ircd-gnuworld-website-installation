name: Docker Integration Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    name: Build test image and run installer in Docker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: gnuworld
          POSTGRES_PASSWORD: gnuworldpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gnuworld"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test Docker image
        run: |
          docker build -t gnuworld-test -f tests/Dockerfile .

      - name: Wait for Postgres service
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U gnuworld; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for Postgres... ($i)"
            sleep 2
          done

      - name: Run installer inside container
        env:
          INSTALL_DIR: /opt/gnuworld
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: gnuworld
          PGPASSWORD: gnuworldpass
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          docker run --rm --network host \
            -e INSTALL_DIR=${INSTALL_DIR} \
            -e PGHOST=${PGHOST} -e PGPORT=${PGPORT} -e PGUSER=${PGUSER} -e PGPASSWORD=${PGPASSWORD} \
            gnuworld-test bash -lc "chmod +x /opt/gnuworld/install.sh && /opt/gnuworld/install.sh" 2>&1 | tee ./artifacts/install_output.txt || true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs
          path: ./artifacts/install_output.txt